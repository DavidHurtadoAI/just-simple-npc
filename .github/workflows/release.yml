name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, typecheck, test and build
        run: npm run check
      - name: Verify release versions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const read = file => JSON.parse(fs.readFileSync(file, 'utf8'));
          const manifest = read('manifest.json');
          const version = process.env.GITHUB_REF_NAME;
          if (version !== manifest.version || version !== read('package.json').version || version !== read('package-lock.json').version) throw Error('Release versions must match the tag');
          if (read('versions.json')[version] !== manifest.minAppVersion) throw Error('Minimum app versions must match');
          const notes = fs.readFileSync('CHANGELOG.md', 'utf8').replaceAll('\r\n', '\n').split('## ' + version + '\n')[1]?.split('\n## ')[0];
          if (!notes) throw Error('Missing release notes');
          fs.writeFileSync('release-notes.md', notes.trim() + '\n\nAll three installable assets were built and attested in GitHub Actions. Requires Obsidian ' + manifest.minAppVersion + ' or later.\n');
          JS
      - name: Attest installable assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Verify provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in main.js manifest.json styles.css; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Publish installable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --title "Just Simple NPC $GITHUB_REF_NAME" --notes-file release-notes.md
      - name: Verify published assets and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir published
          test "$(find published -type f | wc -l)" -eq 3
          for file in main.js manifest.json styles.css; do
            cmp "$file" "published/$file"
            gh attestation verify "published/$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
